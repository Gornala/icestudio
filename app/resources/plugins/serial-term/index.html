<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <title>Serial Terminal</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="app">
      <!-- LEFT SIDEBAR -->
      <aside id="sidebar">
        <!-- Ports section -->
        <section id="port-section">
          <div class="section-header">
            <span>Ports</span>
            <button
              class="st-btn st-btn-sm"
              id="btn-refresh"
              title="Refresh port list"
            >
              &#8635;
            </button>
            <label
              style="
                font-size: 11px;
                display: flex;
                align-items: center;
                gap: 3px;
                color: var(--st-muted);
              "
            >
              <input type="checkbox" id="chk-auto-refresh" /> Auto
            </label>
          </div>
          <ul id="port-list">
            <li id="port-empty">Click &#8635; to scan ports</li>
          </ul>
        </section>

        <!-- Settings section -->
        <section id="settings-section">
          <div class="section-header"><span>Settings</span></div>

          <div class="settings-row">
            <label>Baud rate</label>
            <select id="sel-baud">
              <option value="1200">1200</option>
              <option value="2400">2400</option>
              <option value="4800">4800</option>
              <option value="9600">9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200" selected>115200</option>
              <option value="230400">230400</option>
              <option value="460800">460800</option>
              <option value="921600">921600</option>
              <option value="1000000">1 Mbps</option>
              <option value="2000000">2 Mbps</option>
              <option value="-1">Custom…</option>
            </select>
          </div>
          <div class="settings-row" id="custom-baud-row" style="display: none">
            <label>Custom bps</label>
            <input type="text" id="inp-custom-baud" placeholder="e.g. 500000" />
          </div>
          <div class="settings-row">
            <label>Data bits</label>
            <select id="sel-databits">
              <option value="seven">7</option>
              <option value="eight" selected>8</option>
            </select>
          </div>
          <div class="settings-row">
            <label>Parity</label>
            <select id="sel-parity">
              <option value="no" selected>None</option>
              <option value="odd">Odd</option>
              <option value="even">Even</option>
            </select>
          </div>
          <div class="settings-row">
            <label>Stop bits</label>
            <select id="sel-stopbits">
              <option value="one" selected>1</option>
              <option value="two">2</option>
            </select>
          </div>
          <div class="settings-row">
            <label>Flow ctrl</label>
            <select id="sel-flow">
              <option value="none" selected>None</option>
              <option value="hardware">Hardware</option>
            </select>
          </div>
          <div class="settings-row">
            <label>Max buffer</label>
            <select id="sel-maxbuf">
              <option value="51200">50 KB</option>
              <option value="102400" selected>100 KB</option>
              <option value="512000">500 KB</option>
              <option value="1048576">1 MB</option>
            </select>
          </div>
        </section>

        <!-- Connect buttons -->
        <div id="connect-btns">
          <button id="btn-connect" class="st-btn st-btn-primary st-btn-full">
            &#x1F50C; Connect
          </button>
          <button
            id="btn-disconnect"
            class="st-btn st-btn-danger st-btn-full hidden"
          >
            &#x1F50C; Disconnect
          </button>
        </div>

        <!-- DTR / RTS signals -->
        <div id="signals-row">
          <label
            style="
              display: flex;
              align-items: center;
              gap: 4px;
              font-size: 11px;
              color: var(--st-muted);
            "
          >
            <input type="checkbox" id="chk-dtr" /> DTR
          </label>
          <label
            style="
              display: flex;
              align-items: center;
              gap: 4px;
              font-size: 11px;
              color: var(--st-muted);
            "
          >
            <input type="checkbox" id="chk-rts" /> RTS
          </label>
        </div>
      </aside>

      <!-- Sidebar resize handle -->
      <div id="sidebar-handle"></div>

      <!-- MAIN AREA -->
      <main id="main-area">
        <!-- RX PANEL -->
        <div id="rx-panel" class="data-panel">
          <div class="panel-toolbar">
            <span class="panel-title">Received</span>
            <div class="fmt-btns" data-panel="rx">
              <button class="fmt-btn active" data-fmt="ascii">ASCII</button>
              <button class="fmt-btn" data-fmt="hex">HEX</button>
              <button class="fmt-btn" data-fmt="bin">BIN</button>
              <button class="fmt-btn" data-fmt="multi">MULTI</button>
            </div>
            <label
              style="
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 11px;
                color: var(--st-muted);
              "
            >
              <input type="checkbox" id="chk-timestamp" /> Timestamp
            </label>
            <label
              style="
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 11px;
                color: var(--st-muted);
              "
            >
              <input type="checkbox" id="chk-autoscroll" checked /> Auto-scroll
            </label>
            <span class="toolbar-spacer"></span>
            <button class="st-btn st-btn-sm" id="btn-rx-clear">Clear</button>
            <button class="st-btn st-btn-sm" id="btn-rx-save">
              Save&#x2026;
            </button>
          </div>
          <textarea
            id="rx-output"
            readonly
            spellcheck="false"
            placeholder="Received data will appear here…"
          ></textarea>
          <div id="rx-multi" class="hidden"></div>
        </div>

        <!-- RX/TX resize handle -->
        <div id="rxtx-handle"></div>

        <!-- TX PANEL -->
        <div id="tx-panel" class="data-panel">
          <div class="panel-toolbar">
            <span class="panel-title">Send</span>
            <div class="fmt-btns" data-panel="tx">
              <button class="fmt-btn active" data-fmt="ascii">ASCII</button>
              <button class="fmt-btn" data-fmt="hex">HEX</button>
              <button class="fmt-btn" data-fmt="bin">BIN</button>
            </div>
            <span class="toolbar-spacer"></span>
            <button class="st-btn st-btn-sm" id="btn-tx-load">
              Load&#x2026;
            </button>
            <button class="st-btn st-btn-sm" id="btn-tx-save">
              Save&#x2026;
            </button>
          </div>
          <textarea
            id="tx-input"
            spellcheck="false"
            placeholder="Type data to send…"
          ></textarea>
          <div id="send-bar">
            <label
              >Terminator:
              <select id="sel-lineend">
                <option value="crlf">CRLF (\r\n)</option>
                <option value="cr">CR (\r)</option>
                <option value="lf">LF (\n)</option>
                <option value="tab">Tab (\t)</option>
                <option value="none">None</option>
                <option value="custom">Custom…</option>
              </select>
            </label>
            <input
              type="text"
              id="inp-custom-term"
              placeholder="\n\r or \x0D"
              title="Escape sequences: \n \r \t \0 \xHH"
              style="display: none"
            />
            <label><input type="checkbox" id="chk-echo" checked /> Echo</label>
            <label
              ><input type="checkbox" id="chk-hextrigger" /> Break on:
              <select id="sel-hextrigger">
                <option value="0a">0x0A (LF)</option>
                <option value="0d">0x0D (CR)</option>
                <option value="00">0x00 (NUL)</option>
              </select>
            </label>
            <label
              ><input type="checkbox" id="chk-flush-enter" checked /> Send on
              Enter</label
            >
            <span id="send-bar-spacer"></span>
            <button class="st-btn st-btn-primary" id="btn-send">
              Send &#x21B5;
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- STATUS BAR -->
    <footer id="status-bar">
      <div class="st-indicator" id="st-indicator"></div>
      <span id="st-port">Not connected</span>
      <span id="st-baud"></span>
      <span id="st-rx-count">RX: 0 B</span>
      <span id="st-tx-count">TX: 0 B</span>
      <span id="st-uptime"></span>
    </footer>

    <script src="../../shared/theme.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
